server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecom-product
    #    url: jdbc:mysql://localhost:3306/ecom-product
    username: admin
    password: admin

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate.jdbc.time_zone: "Asia/Kolkata"