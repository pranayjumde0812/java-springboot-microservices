server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecom-product
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate.jdbc.time_zone: "Asia/Kolkata"