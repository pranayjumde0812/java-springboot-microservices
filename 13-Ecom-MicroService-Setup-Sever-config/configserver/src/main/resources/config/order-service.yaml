server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecom-order
    username: admin
    password: admin

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate.jdbc.time_zone: "Asia/Kolkata"